[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molscout"
version = "0.1.0"
description = "Evidence-backed molecular property triage portfolio project"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "typer>=0.12,<1",
  "rdkit>=2024.3",
]

[project.optional-dependencies]
benchmark = ["PyTDC>=0.4,<2"]
agent = ["mcp>=1.3,<2", "langgraph>=0.2,<2", "langsmith>=0.1,<1"]
api = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
gnn = ["chemprop>=2.2,<3", "torch>=2.2"]
transformer = ["transformers>=4.44", "peft>=0.13", "accelerate>=0.34"]
uncertainty = ["MAPIE>=1.0,<2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.11,<2", "PyTDC>=0.4,<2", "mcp>=1.3,<2"]

[project.scripts]
molscout = "molscout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
